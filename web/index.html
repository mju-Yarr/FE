<!DOCTYPE html>
<html lang="ko">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="늦지 않게, 서두르지 않게. Ensom">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ensom">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Ensom</title>
  <style>
    html, body { height: 100%; margin: 0; background: #ffffff; }
    #bootstrap-status {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px;
      box-sizing: border-box;
      color: #171915;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }
    #bootstrap-status strong { font-size: 32px; letter-spacing: -1px; }
    #bootstrap-status p { margin: 0; font-size: 14px; line-height: 1.5; opacity: .72; }
    #bootstrap-status[data-state="error"] { background: #f7f7f2; }
  </style>
</head>
<body>
  <div id="bootstrap-status" role="status" aria-live="polite">
    <strong>Ensom</strong>
    <p id="bootstrap-message">앱을 준비하고 있어요.</p>
  </div>
  <script>
    (() => {
      const status = document.getElementById("bootstrap-status");
      const message = document.getElementById("bootstrap-message");
      let firstFrameRendered = false;

      const hideStatus = () => {
        firstFrameRendered = true;
        status?.remove();
      };
      const showFailure = () => {
        if (firstFrameRendered || document.querySelector("flutter-view")) return;
        if (status) status.dataset.state = "error";
        if (message) {
          message.textContent = "앱을 불러오지 못했어요. 페이지를 새로고침해 주세요.";
        }
      };

      window.addEventListener("flutter-first-frame", hideStatus, { once: true });
      window.addEventListener("error", showFailure);
      window.addEventListener("unhandledrejection", showFailure);
      window.setTimeout(showFailure, 20000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async onerror="window.dispatchEvent(new Event('error'))"></script>
</body>
</html>
