<!DOCTYPE html>
<html lang="ko">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="늦지 않게, 서두르지 않게. Ensom">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ensom">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Ensom</title>
  <style>
    html, body { height: 100%; margin: 0; background: #c6f135; }
    #bootstrap-status {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      color: #14150f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }
    .bootstrap-wordmark {
      display: inline-flex;
      align-items: center;
      font-size: 22px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: 2px;
    }
    .bootstrap-wordmark svg {
      width: .72em;
      height: .72em;
      margin: 0 2px;
      flex: 0 0 auto;
    }
    .bootstrap-slogan {
      margin: 10px 0 0;
      color: #63655e;
      font-size: 11px;
      letter-spacing: .2px;
    }
    /* Flutter 스플래시(splash_screen.dart)처럼 별도 스피너 없이
       워드마크 O 자리 링 자체가 로딩 인디케이터를 겸해서 돈다. */
    .bootstrap-ring-arc {
      transform-origin: 16px 16px;
      animation: bootstrap-ring-spin 1.05s linear infinite;
    }
    @keyframes bootstrap-ring-spin {
      from { transform: rotate(-90deg); }
      to { transform: rotate(270deg); }
    }
    .bootstrap-error {
      display: none;
      position: absolute;
      right: 24px;
      bottom: 44px;
      left: 24px;
      margin: 0;
      color: #6f7269;
      font-size: 12.5px;
      line-height: 1.6;
    }
    #bootstrap-status[data-state="error"] { background: #ffffff; }
    #bootstrap-status[data-state="error"] .bootstrap-ring-arc { animation-play-state: paused; }
    #bootstrap-status[data-state="error"] .bootstrap-error { display: block; }
  </style>
</head>
<body>
  <div id="bootstrap-status" role="status" aria-live="polite">
    <div class="bootstrap-wordmark" aria-label="ENSOM">
      <span>ENS</span>
      <svg aria-hidden="true" viewBox="0 0 32 32">
        <circle cx="16" cy="16" r="11" fill="none" stroke="#4e6810" stroke-width="7"/>
        <circle class="bootstrap-ring-arc" cx="16" cy="16" r="11" fill="none" stroke="#c6f135" stroke-width="7" stroke-dasharray="47 22" stroke-linecap="round"/>
      </svg>
      <span>M</span>
    </div>
    <p class="bootstrap-slogan">늦지 않게, 서두르지 않게.</p>
    <p class="bootstrap-error" id="bootstrap-message"></p>
  </div>
  <script>
    (() => {
      const status = document.getElementById("bootstrap-status");
      const message = document.getElementById("bootstrap-message");
      let firstFrameRendered = false;

      const hideStatus = () => {
        firstFrameRendered = true;
        status?.remove();
      };
      const showFailure = () => {
        if (firstFrameRendered || document.querySelector("flutter-view")) return;
        if (status) status.dataset.state = "error";
        if (message) {
          message.textContent = "앱을 불러오지 못했어요. 페이지를 새로고침해 주세요.";
        }
      };

      window.addEventListener("flutter-first-frame", hideStatus, { once: true });
      window.addEventListener("error", showFailure);
      window.addEventListener("unhandledrejection", showFailure);
      window.setTimeout(showFailure, 20000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async onerror="window.dispatchEvent(new Event('error'))"></script>
</body>
</html>
